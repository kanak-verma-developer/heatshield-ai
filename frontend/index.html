<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeatShield - Heat Safety</title>
<style>
  :root{--bg:#060b18;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--text:#eaf1fb;--muted:#9aa9c2;--cyan:#2dd4bf;--blue:#60a5fa;--side:272px;}
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:radial-gradient(1100px 560px at 85% -10%,#10234a 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0b2a3a 0%,transparent 60%),var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Devanagari',sans-serif;min-height:100vh;line-height:1.5;}
  #bgimg{position:fixed;inset:0;z-index:0;background:url(media/bg-city.jpg) right center/cover no-repeat;opacity:.14;pointer-events:none;}

  .layout{position:relative;z-index:1;display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;}

  /* ---------- sidebar ---------- */
  .side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 16px 18px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(10,20,42,.86),rgba(6,11,24,.9));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
  .brand{display:flex;align-items:center;gap:11px;}
  .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 22px rgba(45,212,191,.28);flex:none;}
  .brand h1{margin:0;font-size:20px;letter-spacing:.2px;} .brand p{margin:0;font-size:12px;color:var(--muted);line-height:1.3;}
  .gl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0 4px 7px;font-weight:700;}
  .seg{display:flex;border:1px solid var(--line);border-radius:14px;padding:4px;gap:3px;background:rgba(255,255,255,.04);}
  .seg.v{flex-direction:column;}
  .seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:14.5px;padding:10px 14px;border-radius:10px;cursor:pointer;text-align:left;transition:background .2s,color .2s;}
  #langTabs button{text-align:center;}
  .seg button:hover{background:rgba(255,255,255,.06);color:var(--text);}
  .seg button.on{background:linear-gradient(90deg,rgba(45,212,191,.3),rgba(96,165,250,.22));color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(45,212,191,.35);}
  #cityTabs button:before{content:'📍';margin-right:8px;font-size:13px;filter:grayscale(1);opacity:.7;}
  #cityTabs button.on:before{filter:none;opacity:1;}
  .seg button:focus-visible,.zrow:focus-visible,.zg:focus-visible,.nav a:focus-visible,.sosbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

  .ov{padding:15px 16px;border-radius:16px;}
  .ovt{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .ovbig{font-size:46px;font-weight:800;line-height:1.1;margin:4px 0 6px;}
  .ov .pill{display:inline-block;margin-bottom:8px;}
  .ovr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);}
  .ovr b{color:var(--text);text-align:right;}
  .ovr:first-of-type{margin-top:6px;}

  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav a{color:var(--muted);text-decoration:none;font-size:14px;padding:8px 12px;border-radius:10px;transition:background .2s,color .2s;}
  .nav a:hover{background:rgba(255,255,255,.07);color:var(--text);}
  .sosbtn{margin-top:auto;display:block;text-align:center;text-decoration:none;font-weight:700;padding:13px 14px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 8px 24px rgba(239,68,68,.3);}

  /* ---------- main ---------- */
  .main{max-width:1120px;width:100%;margin:0 auto;padding:22px 22px 44px;display:flex;flex-direction:column;gap:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 34px rgba(0,0,0,.18);scroll-margin-top:16px;}
  .card h2{margin:0 0 2px;font-size:17px;} .card .sub{color:var(--muted);font-size:13px;margin-bottom:12px;}
  .hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;background:linear-gradient(135deg,rgba(45,212,191,.09),rgba(96,165,250,.05) 55%,rgba(255,255,255,.03));}
  .lab{color:var(--muted);font-size:14px;}
  .big{font-size:clamp(50px,8vw,84px);font-weight:800;line-height:1.05;margin:4px 0;}
  .feels{font-size:15px;color:var(--muted);}
  .facts{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted);} .facts b{color:var(--text);}
  .levelbox{border:2px solid;border-radius:18px;padding:18px 20px;background:rgba(255,255,255,.05);}
  .levelbox b{font-size:23px;display:block;margin-bottom:4px;} .levelbox p{margin:0;font-size:15.5px;}
  .notice{font-size:13px;color:var(--muted);padding:8px 14px;border:1px dashed var(--line);border-radius:12px;display:none;}
  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start;}
  .mapbox{position:relative;width:100%;aspect-ratio:700/520;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0a1222;}
  .mapbox svg{position:absolute;inset:0;width:100%;height:100%;}
  .zg{cursor:pointer;} .zn{opacity:0;transition:opacity .15s;} .zg:hover .zn,.zg.sel .zn,.zg:focus .zn{opacity:1;}
  .zs{font-size:13px;font-weight:800;fill:#fff;text-anchor:middle;pointer-events:none;}
  .zn{font-size:12px;font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.85);stroke-width:3px;text-anchor:middle;pointer-events:none;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .zonehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;} .zonehead h2{margin:0;font-size:20px;}
  .pill{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;color:#06101c;white-space:nowrap;}
  .zbig{font-size:42px;font-weight:800;line-height:1.1;} .zline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);} .zline b{color:var(--text);}
  .zmsg{margin-top:12px;font-size:14px;}
  .zlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:14px;}
  .zrow{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);color:var(--text);font:inherit;font-size:13.5px;cursor:pointer;text-align:left;transition:border-color .2s,background .2s;}
  .zrow:hover{background:rgba(255,255,255,.07);}
  .zrow.sel{border-color:var(--cyan);background:rgba(45,212,191,.1);} .zrow i{width:10px;height:10px;border-radius:50%;flex:none;} .zrow span{margin-left:auto;font-weight:700;}
  .frow{display:grid;grid-template-columns:62px 1fr 64px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;}
  .fbar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;} .fbar i{display:block;height:100%;border-radius:6px;}
  .tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;} .tips li{display:flex;gap:10px;font-size:15px;} .tips li:before{content:'✅';flex:none;}
  .sos{display:flex;align-items:center;gap:10px;justify-content:center;padding:12px 16px;border-radius:14px;border:1px solid rgba(239,68,68,.55);background:rgba(239,68,68,.1);color:#fecaca;font-weight:600;text-align:center;}
  footer{color:var(--muted);font-size:12.5px;} footer details{margin-bottom:8px;} footer summary{cursor:pointer;color:var(--cyan);}
  .loading{color:var(--muted);padding:30px 0;text-align:center;}

  .adcard{position:relative;overflow:hidden;padding:0;min-height:340px;}
  .adfall{position:absolute;inset:0;background:url(media/poster.jpg) center/cover,url(media/map-base.jpg) center/cover;}
  .adcard video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s;}
  .adcard video.on{opacity:1;}
  .adshade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,8,18,.9) 0%,rgba(4,8,18,.1) 55%,rgba(4,8,18,.35) 100%);}
  .adtop{position:absolute;top:14px;left:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .achip{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(6,11,24,.6);color:var(--text);}
  .achip.red{border-color:rgba(239,68,68,.55);color:#fecaca;} button.achip{cursor:pointer;margin-left:auto;}
  .adtip{position:absolute;left:22px;right:22px;bottom:20px;}
  .adtip small{color:var(--cyan);font-size:12.5px;}
  .adtip p{margin:4px 0 12px;font-size:clamp(19px,2.8vw,30px);font-weight:700;line-height:1.3;max-width:780px;transition:opacity .45s,transform .45s;}
  .adtip p.swap{opacity:0;transform:translateY(8px);}
  .dots{display:flex;gap:6px;} .dots i{width:22px;height:4px;border-radius:3px;background:rgba(255,255,255,.28);transition:all .3s;} .dots i.on{background:var(--cyan);width:36px;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 17px;transition:transform .2s,border-color .2s;}
  .kpi:hover{transform:translateY(-2px);border-color:rgba(45,212,191,.4);}
  .kl{font-size:13px;color:var(--muted);} .kv{font-size:27px;font-weight:800;margin:4px 0 2px;} .ks{font-size:12.5px;color:var(--muted);}
  .daychart{width:100%;height:auto;display:block;} .daychart text{fill:var(--muted);font-size:11px;}
  .daytips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .daytip{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.03);font-size:14px;} .daytip b{display:block;font-size:19px;margin-top:2px;}
  .care{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .care div{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.03);font-size:14px;} .care b{display:block;margin-bottom:4px;font-size:15px;}
  .aid{margin:10px 0 0;padding-left:20px;font-size:14.5px;} .aid li{margin:5px 0;}
  .subh{margin:18px 0 8px;font-size:15px;font-weight:700;}

  @media (max-width:980px){
    .layout{grid-template-columns:1fr;}
    .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:14px;padding:14px 14px 6px;border-right:0;border-bottom:1px solid var(--line);}
    .brand{width:100%;} .grp{flex:1 1 220px;}
    .seg.v{flex-direction:row;} #cityTabs button{text-align:center;}
    #cityTabs button:before{display:none;}
    .ov,.nav,.sosbtn{display:none;}
    .main{padding:14px 14px 34px;}
    .hero,.grid{grid-template-columns:1fr;}
  }
  @media (max-width:520px){.card{padding:15px;}.frow{grid-template-columns:54px 1fr 58px;}.daytips{grid-template-columns:1fr;}}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}html{scroll-behavior:auto;}}
</style>
<style id="hide-ov">#ovCard{display:none !important}</style>
</head>
<body>
<div id="bgimg" aria-hidden="true"></div>
<div class="layout">
  <aside class="side">
    <div class="brand"><div class="logo">🛡️</div><div><h1>HeatShield</h1><p id="tagline"></p></div></div>
    <div class="grp"><div class="gl" id="lblCity">City</div><div class="seg v" id="cityTabs" role="tablist"></div></div>
    <div class="grp"><div class="gl" id="lblLang">Language</div><div class="seg" id="langTabs"><button type="button" data-lang="hi">हिन्दी</button><button type="button" data-lang="en">English</button></div></div>
    <section class="card ov" id="ovCard"><div id="ovBody"></div></section>
    <nav class="nav" id="nav">
      <a href="#hero" data-n="now">🌡️ Right now</a>
      <a href="#tipsCard" data-n="tips">✅ What to do</a>
      <a href="#adCard" data-n="video">🎬 Awareness</a>
      <a href="#dayCard" data-n="day">📈 Today, hourly</a>
      <a href="#mainGrid" data-n="map">🗺️ Heat map</a>
      <a href="#forecastCard" data-n="fc">⏱️ Next 6 hours</a>
      <a href="#careCard" data-n="care">🩺 Who needs care</a>
    </nav>
    <a class="sosbtn" id="sideSos" href="tel:108">🚑 Call 108</a>
  </aside>

  <main class="main">
    <div class="notice" id="notice" role="status"></div>
    <section class="card hero" id="hero"><div class="loading" id="loading"></div></section>

    <div class="kpis" id="kpis"></div>
    <section class="card" id="tipsCard" style="display:none;"></section>
    <section class="card adcard" id="adCard" aria-label="Heat safety video">
      <div class="adfall"></div>
      <video id="adVideo" autoplay muted loop playsinline preload="auto" poster="media/poster.jpg"><source src="media/awareness.mp4" type="video/mp4"><source src="media/awareness.webm" type="video/webm"></video>
      <div class="adshade"></div>
      <div class="adtop"><span class="achip" id="adBadge"></span><span class="achip red" id="adSos"></span><button class="achip" id="adToggle" type="button"></button></div>
      <div class="adtip"><small id="adNum"></small><p id="adText"></p><div class="dots" id="adDots"></div></div>
    </section>

    <section class="card" id="dayCard" style="display:none;"></section>
    <div class="grid" id="mainGrid" style="display:none;">
      <section class="card">
        <h2 id="mapTitle"></h2><div class="sub" id="mapSub"></div>
        <div class="mapbox"><svg id="map" viewBox="0 0 700 520" preserveAspectRatio="xMidYMid slice" role="img"></svg></div>
        <div class="legend" id="legend"></div>
        <div class="zlist" id="zlist"></div>
      </section>
      <section class="card" id="zoneCard"></section>
    </div>

    <section class="card" id="forecastCard" style="display:none;"></section>
    <section class="card" id="careCard" style="display:none;"></section>
    <div class="sos" id="sos"></div>
    <footer id="foot"></footer>
  </main>
</div>
<script src="app.js" defer></script>
  <script src="area3d.js"></script>
</body>
</html>
